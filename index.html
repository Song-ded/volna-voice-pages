<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101512"><title>Волна — голосовой чат</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18191c;color:#e5e5e8;font:15px system-ui,sans-serif}main{max-width:620px;margin:12vh auto;padding:24px}header{margin-bottom:24px}.brand{font-size:21px;font-weight:650}.panel{background:#222328;border:1px solid #33343b;border-radius:12px;padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:block;font-size:13px;color:#a7a7b0}.field{flex:1;min-width:150px}input[type=text]{display:block;width:100%;margin-top:8px;background:#18191c;color:#eee;border:1px solid #3a3b43;padding:12px;border-radius:6px;font:inherit}button{border:0;border-radius:6px;padding:12px 16px;background:#6278db;color:white;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#363740}.danger{background:#93464c}#status{color:#a7a7b0;font-size:13px;margin:14px 0;min-height:18px}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.person{background:#18191c;border-radius:8px;padding:16px}.avatar{width:36px;height:36px;background:#363b52;display:grid;place-items:center;border-radius:50%;margin-bottom:10px}.person small{display:block;color:#9898a4;font-size:12px;margin-top:6px}.person input{width:100%;margin-top:12px;accent-color:#8194e4}.meter{height:4px;background:#363740;margin-top:12px;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:#8194e4;width:0}#roomTitle{font-size:16px;margin:0 0 18px}[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:2px solid #aab9ff;outline-offset:3px}@media(max-width:480px){main{margin:5vh auto}.row>button{flex:1}}
.presenting main{max-width:1100px;margin-top:24px}.screen{background:#111;border:1px solid #363740;border-radius:8px;overflow:hidden;margin-bottom:14px}.screen-heading{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:#b7b7c3}.screen-heading button{padding:7px 12px;font-size:12px}.screen video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#080808}.screen:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0}.screen:fullscreen video{flex:1;min-height:0;max-height:none}#screens{margin-bottom:18px}#cameras{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}.camera{margin:0}.camera video{height:240px;object-fit:cover}.camera:fullscreen video{height:auto;object-fit:contain}.people{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.person{position:relative;overflow:hidden;min-height:185px;display:flex;flex-direction:column;justify-content:end}.person .avatar{margin:auto auto 24px}.person.has-camera{min-height:230px;background:#101116}.person.has-camera>.avatar{visibility:hidden}.person.has-camera>strong,.person.has-camera>small,.person.has-camera>input,.person.has-camera>.meter{position:relative;z-index:2;text-shadow:0 1px 4px #000}.person .camera{position:absolute;inset:0;border:0;border-radius:0}.person .camera:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}.person .camera video{width:100%;height:100%;object-fit:cover;max-height:none}.person .camera .screen-heading{position:absolute;top:0;right:0;z-index:3;padding:8px}.person .camera .screen-heading span{display:none}.person .camera .screen-heading button{background:#2229;padding:6px 10px}.person .camera:fullscreen{position:fixed}.person .camera:fullscreen:after{display:none}.person .camera:fullscreen video{object-fit:contain}.chat{border-top:1px solid #363740;margin-top:20px;padding-top:16px}.messages{height:220px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 16px}.message{max-width:85%;align-self:flex-start;background:#30323c;padding:10px 13px;border-radius:12px 12px 12px 3px;overflow-wrap:anywhere}.message.own{align-self:flex-end;background:#354777;border-radius:12px 12px 3px 12px}.message strong{font-size:12px;color:#bdc9f2}.message time{font-size:11px;color:#aeb4c3;margin-left:12px}.message p{font-size:14px;margin:5px 0 0;white-space:pre-wrap}.chat form{display:flex;gap:10px}.chat input[type=text]{margin:0;min-width:0}.chat button{flex-shrink:0}.camera-overlay{display:none}.camera:fullscreen .camera-overlay{display:flex;position:absolute;bottom:22px;left:22px;right:22px;z-index:5;align-items:flex-end;justify-content:space-between;gap:18px;pointer-events:none}.camera-chat{display:flex;flex-direction:column;gap:8px;width:min(380px,60%);max-height:40vh;overflow:hidden}.camera-chat .message{max-width:100%;background:rgba(25,28,38,.8);backdrop-filter:blur(8px);padding:9px 12px}.camera-chat .message p{max-height:80px;overflow:hidden}.person .camera:fullscreen video.self-preview{position:relative;flex:none;width:180px;height:120px;max-height:25vh;object-fit:cover;border-radius:10px;border:1px solid #ffffff55;background:#111;box-shadow:0 4px 20px #0008}.camera:fullscreen .screen-heading span{display:block}.camera:fullscreen .screen-heading{left:0;justify-content:space-between;background:linear-gradient(#0008,transparent);padding:14px}@media(max-width:600px){.camera:fullscreen .camera-overlay{bottom:12px;left:12px;right:12px;gap:10px}.person .camera:fullscreen video.self-preview{width:110px;height:80px}.camera-chat .message{font-size:12px}.camera-chat .message p{font-size:12px}}dialog{background:#222328;color:#eee;border:1px solid #454650;border-radius:12px;padding:20px;width:min(440px,calc(100% - 32px))}dialog::backdrop{background:#000a}dialog h2{font-size:18px;margin:0 0 16px}dialog select{width:100%;padding:12px;background:#18191c;color:#eee;border:1px solid #454650;border-radius:6px;font:inherit}#cameraPreview{display:block;width:100%;height:240px;background:#101116;object-fit:contain;border-radius:8px;margin-top:14px}#cameraNote{font-size:13px;color:#b7bbc7;min-height:18px;margin:12px 0}dialog .row{justify-content:end}</style>
<main><header><div class="brand">волна</div></header>
<section class="panel" id="lobby"><div class="row"><label class="field">Имя<input id="name" type="text" maxlength="32" placeholder="Гость" autocomplete="nickname"></label><input id="code" type="hidden"><button id="join">Создать комнату</button></div></section>
<p id="status" role="status" aria-live="polite"></p>
<section class="panel" id="call" hidden><div class="row" style="justify-content:space-between;align-items:start;margin-bottom:18px"><h2 id="roomTitle">Комната</h2><button id="share" class="secondary">Ссылка</button></div><div id="screens" hidden></div><div id="cameras" hidden></div><div class="people" id="people"></div><div class="row" style="margin-top:20px"><button id="mute" aria-pressed="false">Микрофон: вкл</button><button id="deafen" class="secondary" aria-pressed="false">Звук: вкл</button><button id="resume" class="secondary" hidden>Включить звук</button><button id="noise" class="secondary" aria-pressed="true">Шумодав: вкл</button><button id="camera" class="secondary" aria-pressed="false">Камера: выкл</button><button id="screenShare" class="secondary" aria-pressed="false">Показать экран</button><button id="leave" class="danger">Выйти</button></div><section class="chat" aria-label="Чат"><div id="messages" class="messages" role="log" aria-live="polite" aria-label="Сообщения"></div><form id="chatForm"><input id="message" type="text" maxlength="2000" placeholder="Сообщение" aria-label="Сообщение" autocomplete="off"><button id="send" type="submit">Отправить</button></form></section></section></main>
<dialog id="cameraDialog" aria-labelledby="cameraDialogTitle"><h2 id="cameraDialogTitle">Камера</h2><select id="cameraChoice" aria-label="Выбор камеры"><option value="front">Передняя</option><option value="back">Задняя</option></select><video id="cameraPreview" autoplay muted playsinline aria-label="Предпросмотр камеры"></video><p id="cameraNote" role="status"></p><div class="row"><button id="cameraCancel" class="secondary">Отмена</button><button id="cameraConfirm" disabled>Включить</button></div></dialog><script type="module" src="app.js"></script></html>
